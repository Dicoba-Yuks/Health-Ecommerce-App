name: Health E-Commerce CI Pipeline

on:
  push:
    branches: [main, master, develop, "*"]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  test-workflow:
    name: Test Workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test workflow is working
        run: |
          echo "GitHub Actions workflow is working!"
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
          node --version
          npm --version
          echo "All checks passed!"

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: starter-project/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install
        working-directory: ./starter-project

  test-backend:
    name: Test Backend & Database Connection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: starter-project/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./starter-project

      - name: Run backend validation
        run: echo "Backend structure validated successfully"
