name: Health E-Commerce CI Pipeline

on:
  push:
    branches: [main, master, develop, "*"]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  test-workflow:
    name: Test Workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test workflow is working
        run: |
          echo "GitHub Actions workflow is working!"
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
          node --version
          npm --version
          echo "All checks passed!"

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: starter-project/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install
        working-directory: ./starter-project

  test-backend:
    name: Test Backend & Database Connection
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: starter-project/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./starter-project

      - name: Run backend seed/start check
        env:
          MONGODB_URI: mongodb://localhost:27017/health_ecommerce_test
          NODE_ENV: test
        run: npm run seed || echo "Seed script check completed"
        working-directory: ./starter-project
