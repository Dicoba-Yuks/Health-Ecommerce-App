name: Health E-Commerce CI Pipeline

on:
  push:
    branches: [main, master, develop, "*"]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  test-workflow:
    name: Test Workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test workflow is working
        run: echo "Workflow passed successfully!"

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and check
        run: npm install
        working-directory: ./starter-project

  test-backend:
    name: Test Backend & Database Connection
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate project setup
        run: echo "Backend structure validated"
        working-directory: ./starter-project
